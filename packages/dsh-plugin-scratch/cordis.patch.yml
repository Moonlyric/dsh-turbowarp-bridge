# 组合包层：把本插件插入 cordis 插件列表
#
# name 的取值（三种都行，dsh 0.1.2-rc.1 实测）：
#   1) 包名             name: dsh-plugin-scratch      ← 从 profile 目录做 ESM 解析（需已 pnpm/npm 装进 profile）
#   2) 相对路径         name: ../local-plugins/dsh-plugin-scratch/index.js
#                                                     ← 相对本补丁文件所在目录；插件必须位于 harness\profiles\ 之下
#                                                        （否则上溯不到 profiles\node_modules，@deepseek-ai/* 解析失败）
#   3) file:// 绝对 URL name: file:///C:/path/to/index.js
# ⚠️ 裸 Windows 路径（G:\...\index.js）不被支持，会被当成 g: 协议。
- insert:
    - id: scratch
      name: dsh-plugin-scratch
      config:
        # 安全档位：auto（直接落盘）| preview（默认，先 diff 后应用）| suggest（只给建议）
        safety: preview
        # 桥监听端口（浏览器扩展连接用）
        bridgePort: 31820
        # 快照上限（防止巨型项目刷爆磁盘）
        maxSnapshots: 50
        # Skill 经验库总开关（false 时 scratch_skills 返回 disabled，工具本体不受影响）
        skillsEnabled: true
        # 唤起编辑器（scratch_open_editor）用哪个浏览器；留空 = 系统默认浏览器
        # browserPath: C:\Program Files\Google\Chrome\Application\chrome.exe
        # 本地 TurboWarp Desktop 的 exe；留空 = 自动找（常见目录 + 注册表卸载项）
        # 桌面版走 **CDP 直连**（启动时带 --remote-debugging-port，把页面执行器注进默认上下文）：
        # 它装不了 Chrome 扩展，但照样能被 AI 读写积木 —— 零安装、零 token。
        # desktopPath: G:\09 Eutopia\scr\TurboWarp\TurboWarp.exe
        # 「可接管」固定调试端口：app=desktop 会先探这个端口，有实例就直接接管（不新开窗口）。
        # 用仓库根目录的「启动TurboWarp(AI可接管).cmd」启动桌面版就是走这个端口。
        # 改这里的话记得同步改那个 .cmd。
        # desktopDebugPort: 31821
